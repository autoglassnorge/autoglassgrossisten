[project]
name = "autoglass-b2b"
root = "/Users/taj/bilglass"
agents_dir = ".kimi/agents"

[loop_control]
# 0.14.2: default er 1000, men vi bruker 750 for å spare kontekst
# og unngå unødvendig lang-running turns i dette prosjektet.
max_steps_per_turn = 750
# 0.14.2: default 5 retries per step
max_retries_per_step = 3
# 0.14.2: Ralph mode disabled (0 = kun første turn)
max_ralph_iterations = 0
reserved_context_size = 35000
# 0.14.2: default 0.92, men vi bruker 0.82 for å kompakte tidligere
compaction_trigger_ratio = 0.82

[background]
# 0.14.2: flere background tasks for parallelle subagents
max_running_tasks = 4
# 0.14.2: økt for større fil-output fra scraper-scripts
# Redusert fra 50000 → 35000 for token-sparing. Gir fortsatt ~8-9K tokens output.
read_max_bytes = 35000
# 0.14.2: mer kontekst i background notifications
# Redusert fra 5000 → 3000 for token-sparing. 3000 chars dekker de fleste feilmeldinger/sammendrag.
notification_tail_lines = 30
notification_tail_chars = 3000
# 0.14.2: polling interval for background task status
wait_poll_interval_ms = 500
# 0.14.2: Fast 30-min timeout for subagents (1800s)
# Vi overstyrer til 900s for raskere feedback i Bilglass-prosjektet
agent_task_timeout_s = 900
# 0.14.2: print mode ceiling for background tasks
print_wait_ceiling_s = 3600

[mcp.client]
# 0.14.2: FastMCP 3.2.4, OAuth tokens lagres i ~/.kimi/mcp-oauth/
tool_call_timeout_ms = 180000

[ui]
# 0.14.2: Vis thinking-stream by default for bedre innsyn
show_thinking_stream = true
# 0.14.2: dark theme for macOS Terminal/iTerm
theme = "dark"
# 0.14.2: suppress afk-mode system reminder (yolo injecter ikke lenger)
skip_afk_prompt_injection = false
# 0.14.2: plan mode av som default
default_plan_mode = false

[model]
# 0.14.2: Sampling-parametere for Kimi K2.7 Code
temperature = 0.2      # Lav = mer konsistent, forutsigbar kode
top_p = 0.9            # Bra balanse mellom kreativitet og presisjon
thinking_keep = true   # Bevar "thinking"-output for debugging

[skills]
# 0.14.2: Slå sammen alle skills fra .kimi/skills, .claude/skills, etc.
merge_all_available_skills = true
# 0.14.2: ekstra skill directories (relative to project root / nearest .git)
extra_skill_dirs = []

[notifications]
# 0.14.2: claim stale timeout
claim_stale_after_ms = 15000

[[hooks]]
event = "SessionEnd"
command = "/Users/taj/bilglass/.kimi/hooks/session-end.sh"
timeout = 30

[[hooks]]
event = "SessionStart"
command = "/Users/taj/bilglass/.kimi/hooks/session-start.sh"
timeout = 10
