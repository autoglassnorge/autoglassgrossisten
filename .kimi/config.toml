[project]
name = "autoglass-b2b"
root = "/Users/taj/bilglass"
agents_dir = ".kimi/agents"

[loop_control]
# v1.45.0: default er 1000, men vi bruker 750 for å spare kontekst
# og unngå unødvendig lang-running turns i dette prosjektet.
max_steps_per_turn = 750
# v1.45.0: default 3 retries per step
max_retries_per_step = 3
# v1.45.0: Ralph mode disabled (0 = kun første turn)
max_ralph_iterations = 0
reserved_context_size = 30000
# v1.45.0: default 0.85, men vi bruker 0.82 for å kompakte tidligere
compaction_trigger_ratio = 0.82

[background]
# v1.45.0: flere background tasks for parallelle subagents
max_running_tasks = 4
# v1.37.0+: økt for større fil-output fra scraper-scripts
read_max_bytes = 50000
# v1.45.0: mer kontekst i background notifications
notification_tail_lines = 30
notification_tail_chars = 5000
# v1.45.0: polling interval for background task status
wait_poll_interval_ms = 500
agent_task_timeout_s = 900
# v1.37.0+: print mode ceiling for background tasks
print_wait_ceiling_s = 3600

[mcp.client]
# v1.43.0+: FastMCP 3.2.4, OAuth tokens lagres i ~/.kimi/mcp-oauth/
tool_call_timeout_ms = 180000

[ui]
# v1.35.0+: Vis thinking-stream by default for bedre innsyn
show_thinking_stream = true
# v1.45.0: dark theme for macOS Terminal/iTerm
theme = "dark"
# v1.40.0+: suppress afk-mode system reminder (yolo injecter ikke lenger)
skip_afk_prompt_injection = false
# v1.45.0: plan mode av som default
default_plan_mode = false

[skills]
# v1.39.0+: Slå sammen alle skills fra .kimi/skills, .claude/skills, etc.
merge_all_available_skills = true
# v1.39.0+: ekstra skill directories (relative to project root / nearest .git)
extra_skill_dirs = []

[notifications]
# v1.45.0: claim stale timeout
claim_stale_after_ms = 15000

[[hooks]]
event = "SessionEnd"
command = "/Users/taj/bilglass/.kimi/hooks/session-end.sh"
timeout = 30

[[hooks]]
event = "SessionStart"
command = "/Users/taj/bilglass/.kimi/hooks/session-start.sh"
timeout = 10
