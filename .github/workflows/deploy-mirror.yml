name: Deploy WP Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  deploy-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Installer avhengigheter
        run: npm ci

      - name: Scrape WP + bygg mirror
        run: |
          node scripts/scrape-wp.mjs
          node scripts/download-wp-media.mjs
          node scripts/build-wp-mirror.mjs

      - name: Deploy mirror til Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: autoglass-mirror
          directory: dist-mirror

      - name: Verifiser mirror
        run: |
          sleep 10
          curl -sfI https://autoglass-mirror.pages.dev/ | grep -q "200" || exit 1
          echo "✅ Mirror deploy OK"
