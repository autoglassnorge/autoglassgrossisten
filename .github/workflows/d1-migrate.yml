name: D1 Migrate & Enrich

on:
  workflow_dispatch:

jobs:
  migrate-and-enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g wrangler

      - name: D1 Migration 0005 — search_history
        working-directory: api/cf-worker
        run: |
          wrangler d1 execute glass-catalog-db --remote --file migrations/0005_search_history.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

