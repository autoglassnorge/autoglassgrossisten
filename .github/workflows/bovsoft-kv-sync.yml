name: Bovsoft KV Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC

jobs:
  sync-bovsoft-to-kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upload Bovsoft bootstrap data to KV
        run: node scripts/upload-bovsoft-to-kv.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.GLASS_KV_NAMESPACE_ID }}

      - name: Verify KV keys exist
        run: |
          curl -sf "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.GLASS_KV_NAMESPACE_ID }}/keys?prefix=bovsoft:" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '.result | length'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
