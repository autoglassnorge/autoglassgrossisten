name: D1 Position Migration

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Migration step'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - columns
          - update
          - import

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler

      - name: Add position columns
        if: github.event.inputs.step == 'all' || github.event.inputs.step == 'columns'
        run: |
          npx wrangler d1 execute glass-catalog-db --remote \
            --file=scripts/position-audit/migrations/001-add-position-columns.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update existing positions
        if: github.event.inputs.step == 'all' || github.event.inputs.step == 'update'
        run: |
          npx wrangler d1 execute glass-catalog-db --remote \
            --file=scripts/position-audit/migrations/002-update-positions.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import auto-glass products
        if: github.event.inputs.step == 'all' || github.event.inputs.step == 'import'
        run: |
          npx wrangler d1 execute glass-catalog-db --remote \
            --file=scripts/position-audit/migrations/003-import-autoglass-products.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify migration
        run: |
          npx wrangler d1 execute glass-catalog-db --remote \
            --command "SELECT parse_status, COUNT(*) as count FROM glass_catalog GROUP BY parse_status;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
