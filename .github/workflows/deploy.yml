name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g wrangler
      - name: Deploy Worker
        working-directory: api/cf-worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  upload-kv:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Upload catalog to KV
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' api/cf-worker/scripts/upload-catalog.ts
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.GLASS_KV_NAMESPACE_ID }}

  upload-static:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g wrangler
      - name: Upload static site files to KV
        working-directory: api/cf-worker
        run: |
          for f in ../../index.html ../../vin-sok.html ../../produkter.html ../../bli-kunde.html ../../kontakt.html ../../om-oss.html ../../kundeportal.html; do
            key="_site_$(basename $f | sed 's/\./_/g')"
            echo "Uploading $f → $key"
            wrangler kv:key put "$key" --path="$f" --namespace-id="${{ secrets.GLASS_KV_NAMESPACE_ID }}" --local=false || true
          done
          for f in ../../css/tokens.css ../../css/base.css ../../css/components.css; do
            key="_site_css_$(basename $f | sed 's/\./_/g')"
            echo "Uploading $f → $key"
            wrangler kv:key put "$key" --path="$f" --namespace-id="${{ secrets.GLASS_KV_NAMESPACE_ID }}" --local=false || true
          done
          for f in ../../js/i18n.js ../../js/main.js ../../js/search-glass.js ../../js/auth.js; do
            key="_site_js_$(basename $f | sed 's/\./_/g')"
            echo "Uploading $f → $key"
            wrangler kv:key put "$key" --path="$f" --namespace-id="${{ secrets.GLASS_KV_NAMESPACE_ID }}" --local=false || true
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
