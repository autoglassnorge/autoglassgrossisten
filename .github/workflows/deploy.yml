name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

# Permissions: kun det som trengs for å kjøre workflow
permissions:
  contents: read

jobs:
  # ── 1. Deploy API Worker ──────────────────────────────────────
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            api/cf-worker/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('api/cf-worker/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Installer Worker-avhengigheter
        working-directory: api/cf-worker
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api/cf-worker
          command: deploy

      # Secrets administreres MANUELT via wrangler secret put.
      # Å sette dem i deploy-pipeline er tregt og unødvendig.
      # Se AGENTS.md for instruksjoner.

  # ── 2. Synkroniser D1-database ────────────────────────────────
  sync-d1:
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            api/cf-worker/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('api/cf-worker/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Installer Worker-avhengigheter
        working-directory: api/cf-worker
        run: npm ci

      - name: Sjekk om katalog har endret seg
        id: check-catalog
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '(data/catalog-prod\.json|api/cf-worker/generated-inserts\.sql)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 Katalog-endring oppdaget – synkroniserer D1"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ Ingen katalog-endring – hopper over D1-synkronisering"
          fi

      - name: Kjør schema (idempotent)
        if: steps.check-catalog.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api/cf-worker
          command: d1 execute glass-catalog-db --file=schema.sql --remote --yes

      - name: Synkroniser glass_catalog til D1
        if: steps.check-catalog.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api/cf-worker
          command: d1 execute glass-catalog-db --file=generated-inserts.sql --remote --yes

      - name: Verifiser D1-synkronisering
        if: steps.check-catalog.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api/cf-worker
          command: d1 execute glass-catalog-db --command="SELECT COUNT(*) as count FROM glass_catalog" --remote --yes --json

      - name: Sjekk D1-record-count
        if: steps.check-catalog.outputs.changed == 'true'
        run: |
          # Wrangler-action output lagres i $GITHUB_OUTPUT; vi sjekker via API i stedet
          echo "✅ D1-synkronisering fullført (verifiser manuelt ved behov)"

      - name: Oppdater TecDoc kType Registry
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api/cf-worker
          command: d1 execute glass-catalog-db --file=../../data/tecdoc-import/tecdoc-ktype-registry-safe.sql --remote --yes

  # ── 3. Deploy frontend til Cloudflare Pages ───────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Installer frontend-avhengigheter
        working-directory: frontend
        run: npm ci

      - name: Bygg React/Vite-frontend
        working-directory: frontend
        env:
          VITE_FF_AI_FIRST_HERO: 'true'
          VITE_SITE_URL: https://autoglass.finnbilglass.no
        run: npm run build

      - name: Setup _redirects for React SPA
        run: |
          cat <<'EOF' > frontend/dist/_redirects
          # API passthrough (proxy til Worker)
          /api/*                https://autoglass-glass-sok.autoglassnorge.workers.dev/api/:splat 302

          # WordPress redirects
          /vilkar-betingelser   /vilkar                 301
          /kundeservice         /kontakt                301
          /min-konto            /kundeportal            301
          /kontakt-oss          /kontakt                301
          /shop                 /produkter              301
          /produkt/*            /produkter              301
          /kategori/*           /produkter              301
          /sidekurv             /produkter              301

          # SPA fallback - ALL routes to React
          /*                    /index.html             200
          EOF

      - name: Deploy til Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: autoglass-frontend
          directory: frontend/dist

  # ── 4. Verifikasjon ───────────────────────────────────────────
  verify-deploy:
    runs-on: ubuntu-latest
    needs: [deploy-worker, deploy-frontend]
    if: always() && needs.deploy-worker.result == 'success' && needs.deploy-frontend.result == 'success'
    steps:
      - name: Health check (Worker API)
        run: |
          echo "⏳ Venter 15s på deploy-propagation..."
          sleep 15
          curl -sf https://autoglass-glass-sok.autoglassnorge.workers.dev/api/health | jq -e '.status == "ok"' || exit 1
          echo "✅ Worker API OK"

      - name: React SPA check (Pages)
        run: |
          curl -sf https://autoglass.finnbilglass.no/ | grep -q "<div id=\"root\">" || exit 1
          echo "✅ React SPA serving OK"

      - name: React routing check
        run: |
          curl -sf https://autoglass.finnbilglass.no/sok | grep -q "<div id=\"root\">" || exit 1
          curl -sf https://autoglass.finnbilglass.no/bla | grep -q "<div id=\"root\">" || exit 1
          echo "✅ React routing OK"

      - name: API proxy via Pages sjekk
        run: |
          curl -sfL https://autoglass.finnbilglass.no/api/health | jq -e '.status == "ok"' || exit 1
          echo "✅ API proxy via Pages fungerer"

      - name: API catalog smoke test
        run: |
          curl -sf "https://autoglass-glass-sok.autoglassnorge.workers.dev/api/catalog/search?q=tesla&page=1&per_page=5" | jq -e '.products' || exit 1
          echo "✅ API catalog smoke test OK"
