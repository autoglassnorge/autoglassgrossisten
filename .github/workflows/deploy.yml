name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Deploy API Worker ──────────────────────────────────────
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g wrangler
      - name: Deploy Worker
        working-directory: api/cf-worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set SVV_API_KEY secret
        working-directory: api/cf-worker
        run: |
          echo "a578e3c7-f27b-4b73-8938-af26edd89d68" | wrangler secret put SVV_API_KEY --name autoglass-glass-sok
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 2. Upload catalog to KV ───────────────────────────────────
  upload-kv:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Upload catalog to KV
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' api/cf-worker/scripts/upload-catalog.ts
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.GLASS_KV_NAMESPACE_ID }}

  # ── 3. Deploy frontend to Cloudflare Pages ────────────────────
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g wrangler
      - name: Build Pages bundle
        run: |
          mkdir -p _site
          # Copy files (handle missing dirs gracefully)
          cp -r *.html css/ js/ robots.txt sitemap.xml _redirects _site/ 2>/dev/null || true
          mkdir -p _site/images
          cp -r images/* _site/images/ 2>/dev/null || true
          echo "Bundle contents:"
          ls -la _site/
          echo "Bundle size:"
          du -sh _site/
      - name: Create Pages project (if missing)
        run: |
          wrangler pages project create autoglass-frontend --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Pages
        run: |
          wrangler pages deploy _site \
            --project-name=autoglass-frontend \
            --branch=main \
            --commit-hash=${{ github.sha }} \
            --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
