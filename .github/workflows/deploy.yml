name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ── 1. Deploy API Worker ──────────────────────────────────────
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: api/cf-worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # SVV_API_KEY hentes fra GitHub Secret (IKKE hardkodet).
      # NB: Nøkkelen MÅ være rotert i SVV-portalen siden den tidligere
      # lå eksponert i git-historikken.
      - name: Set SVV_API_KEY secret
        working-directory: api/cf-worker
        run: |
          echo "${{ secrets.SVV_API_KEY }}" | wrangler secret put SVV_API_KEY --name autoglass-glass-sok
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 2. Deploy frontend til Cloudflare Pages ───────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g wrangler

      - name: Deploy til Cloudflare Pages
        run: |
          npx wrangler pages deploy . \
            --project-name=autoglass-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 3. Upload catalog to KV ───────────────────────────────────
  upload-kv:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm install --save-dev @types/node
      - name: Upload catalog to KV
        run: npx ts-node --compiler-options '{"module":"CommonJS","types":["node"]}' api/cf-worker/scripts/upload-catalog.ts
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.GLASS_KV_NAMESPACE_ID }}

  # ── 4. Verifikasjon ───────────────────────────────────────────
  verify-deploy:
    runs-on: ubuntu-latest
    needs: [deploy-worker, deploy-frontend, upload-kv]
    if: always() && needs.deploy-worker.result == 'success'
    steps:
      - name: Health check (Worker API)
        run: |
          echo "⏳ Venter 30s på deploy-propagation..."
          sleep 30
          curl -sf https://autoglass-glass-sok.autoglassnorge.workers.dev/api/health | jq -e '.status == "ok"' || exit 1
          echo "✅ Worker API OK"

      - name: Static file check (Pages)
        run: |
          curl -sfI https://autoglass-frontend.pages.dev/css/tokens.css | grep -q "200" || exit 1
          echo "✅ Pages static serving OK"

      - name: API smoke test
        run: |
          curl -sf "https://autoglass-glass-sok.autoglassnorge.workers.dev/api/glass?regnr=SU18018" | jq -e '.vehicle.regnr' || exit 1
          echo "✅ API smoke test OK"
