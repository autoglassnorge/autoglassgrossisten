name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g wrangler
      - name: Deploy Worker
        working-directory: api/cf-worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  upload-kv:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Upload catalog to KV
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' api/cf-worker/scripts/upload-catalog.ts
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.GLASS_KV_NAMESPACE_ID }}

  upload-static:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - name: Upload static files to KV via API
        run: |
          upload_file() {
            local file="$1"
            local key="$2"
            local ct="$3"
            echo "Uploading $file → $key"
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.GLASS_KV_NAMESPACE_ID }}/values/$key" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: text/plain" \
              --data-binary "@$file" | python3 -c "import sys,json; d=json.load(sys.stdin); print('  ' + ('✅' if d.get('success') else '❌ ' + str(d.get('errors',''))))"
          }
          upload_file "index.html" "_site_index_html" "text/html"
          upload_file "vin-sok.html" "_site_vin_sok_html" "text/html"
          upload_file "produkter.html" "_site_produkter_html" "text/html"
          upload_file "bli-kunde.html" "_site_bli_kunde_html" "text/html"
          upload_file "kontakt.html" "_site_kontakt_html" "text/html"
          upload_file "om-oss.html" "_site_om_oss_html" "text/html"
          upload_file "kundeportal.html" "_site_kundeportal_html" "text/html"
          upload_file "css/tokens.css" "_site_css_tokens_css" "text/css"
          upload_file "css/base.css" "_site_css_base_css" "text/css"
          upload_file "css/components.css" "_site_css_components_css" "text/css"
          upload_file "js/i18n.js" "_site_js_i18n_js" "application/javascript"
          upload_file "js/main.js" "_site_js_main_js" "application/javascript"
          upload_file "js/search-glass.js" "_site_js_search_glass_js" "application/javascript"
          upload_file "js/auth.js" "_site_js_auth_js" "application/javascript"
