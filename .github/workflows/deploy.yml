name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  # ── 1. Deploy API Worker ──────────────────────────────────────
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: api/cf-worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # SVV_API_KEY hentes fra GitHub Secret (IKKE hardkodet).
      # NB: Nøkkelen MÅ være rotert i SVV-portalen siden den tidligere
      # lå eksponert i git-historikken.
      - name: Set SVV_API_KEY secret
        working-directory: api/cf-worker
        run: |
          echo "${{ secrets.SVV_API_KEY }}" | wrangler secret put SVV_API_KEY --name autoglass-glass-sok
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set BOVSOFT_CLIENT_ID secret
        working-directory: api/cf-worker
        run: |
          echo "${{ secrets.BOVSOFT_CLIENT_ID }}" | wrangler secret put BOVSOFT_CLIENT_ID --name autoglass-glass-sok
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set BOVSOFT_SECCODE secret
        working-directory: api/cf-worker
        run: |
          echo "${{ secrets.BOVSOFT_SECCODE }}" | wrangler secret put BOVSOFT_SECCODE --name autoglass-glass-sok
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Biluppgitter API-nøkkel — legges til når den er tilgjengelig
      - name: Set BILUPPGIFTER_API_KEY secret
        working-directory: api/cf-worker
        run: |
          echo "${{ secrets.BILUPPGIFTER_API_KEY }}" | wrangler secret put BILUPPGIFTER_API_KEY --name autoglass-glass-sok
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 2. Synkroniser D1-database ────────────────────────────────
  sync-d1:
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g wrangler

      - name: Sjekk om katalog har endret seg
        id: check-catalog
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '(data/catalog-prod\.json|api/cf-worker/generated-inserts\.sql)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 Katalog-endring oppdaget – synkroniserer D1"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ Ingen katalog-endring – hopper over D1-synkronisering"
          fi

      - name: Kjør schema (idempotent)
        if: steps.check-catalog.outputs.changed == 'true'
        working-directory: api/cf-worker
        run: wrangler d1 execute glass-catalog-db --file=schema.sql --remote --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Synkroniser glass_catalog til D1
        if: steps.check-catalog.outputs.changed == 'true'
        working-directory: api/cf-worker
        run: |
          LINES=$(wc -l < generated-inserts.sql)
          echo "🔄 Sletter eksisterende data og inserter $LINES linjer..."
          wrangler d1 execute glass-catalog-db --file=generated-inserts.sql --remote --yes
          echo "✅ D1-synkronisering fullført"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verifiser D1-synkronisering
        if: steps.check-catalog.outputs.changed == 'true'
        working-directory: api/cf-worker
        run: |
          COUNT=$(wrangler d1 execute glass-catalog-db --command="SELECT COUNT(*) as count FROM glass_catalog" --remote --yes --json | jq -r '.[0].results[0].count')
          echo "📊 D1 glass_catalog: $COUNT records"
          if [ "$COUNT" -lt 18000 ]; then
            echo "❌ For få records i D1: $COUNT (forventet ~18737)"
            exit 1
          fi
          echo "✅ D1-verifisering OK"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Synkroniser TecDoc kType Registry (alltid idempotent) ───
      - name: Oppdater TecDoc kType Registry
        working-directory: api/cf-worker
        run: |
          echo "🔄 Oppdaterer tecdoc_ktype_registry (idempotent)..."
          wrangler d1 execute glass-catalog-db --file=../../data/tecdoc-import/tecdoc-ktype-registry-safe.sql --remote --yes
          COUNT=$(wrangler d1 execute glass-catalog-db --command="SELECT COUNT(*) as count FROM tecdoc_ktype_registry" --remote --yes --json | jq -r '.[0].results[0].count')
          echo "📊 tecdoc_ktype_registry: $COUNT mappings"
          if [ "$COUNT" -lt 800 ]; then
            echo "❌ For få mappings: $COUNT (forventet 908)"
            exit 1
          fi
          echo "✅ TecDoc kType Registry OK"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 3. Deploy frontend til Cloudflare Pages ───────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g wrangler

      - name: Installer frontend-avhengigheter
        working-directory: frontend
        run: npm install

      - name: Bygg React/Vite-frontend
        working-directory: frontend
        run: npm run build

      - name: Merge statiske sider + React-app
        run: |
          echo "📄 Kopierer statiske HTML-sider til frontend/dist/..."
          # Behold React-appens index.html som react.html for SPA-routing
          mv frontend/dist/index.html frontend/dist/react.html
          # Kopier alle rot-HTML-filer (inkludert index.html som blir hovedsiden)
          cp *.html frontend/dist/
          cp -r css js images frontend/dist/
          echo "✅ Statiske filer kopiert"

      - name: Merge _redirects (API + React-ruter + WordPress + fallback)
        run: |
          echo "🔄 Bygger kombinert _redirects..."
          cat <<'EOF' > frontend/dist/_redirects
          # API passthrough (302 — CORS-compatible proxy til Worker)
          /api/*                https://autoglass-glass-sok.autoglassnorge.workers.dev/api/:splat 302

          # React-app ruter (SPA rewrite — URL i browser endres ikke)
          /sok                  /react.html             200
          /bla                  /react.html             200
          /kasse                /react.html             200
          /bilglassguide/*      /react.html             200

          # WordPress redirects (fra rot-mappe)
          /vilkar-betingelser   /vilkar                 301
          /kundeservice         /kontakt                301
          /min-konto            /kundeportal            301
          /kontakt-oss          /kontakt                301
          /shop                 /produkter              301
          /produkt/*            /produkter              301
          /kategori/*           /produkter              301
          /sidekurv             /produkter              301

          # SPA fallback for statiske sider (og React catch-all)
          /* /index.html 200
          EOF
          echo "✅ _redirects ferdig:"
          cat frontend/dist/_redirects

      - name: Deploy til Cloudflare Pages
        run: |
          npx wrangler pages deploy frontend/dist \
            --project-name=autoglass-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 4. Verifikasjon ───────────────────────────────────────────
  verify-deploy:
    runs-on: ubuntu-latest
    needs: [deploy-worker, deploy-frontend]
    if: always() && needs.deploy-worker.result == 'success' && needs.deploy-frontend.result == 'success'
    steps:
      - name: Health check (Worker API)
        run: |
          echo "⏳ Venter 60s på deploy-propagation..."
          sleep 60
          curl -sf https://autoglass-glass-sok.autoglassnorge.workers.dev/api/health | jq -e '.status == "ok"' || exit 1
          echo "✅ Worker API OK"

      - name: Static file check (Pages)
        run: |
          curl -sf https://autoglass-frontend.pages.dev/ | grep -q "autoglass\|react\|<div id=\"root\">" || exit 1
          echo "✅ Pages static serving OK"

      - name: Katalog.html stegvis søk sjekk
        run: |
          # Pages redirecter /katalog.html → /katalog (308). Bruk -L for å følge redirect.
          curl -sfL "https://autoglass-frontend.pages.dev/katalog.html?v=$GITHUB_RUN_ID" | grep -q "renderStepwiseResults" || exit 1
          echo "✅ Katalog.html med stegvis glass-søk er deployet"

      - name: API proxy via Pages sjekk
        run: |
          curl -sfL https://autoglass-frontend.pages.dev/api/health | jq -e '.status == "ok"' || exit 1
          echo "✅ API proxy via Pages fungerer"

      - name: API catalog smoke test
        run: |
          curl -sf "https://autoglass-glass-sok.autoglassnorge.workers.dev/api/catalog/search?q=tesla&page=1&per_page=5" | jq -e '.products' || exit 1
          echo "✅ API catalog smoke test OK"
