name: TecDoc kType Import

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Input file path (relative to repo root)'
        required: true
        default: 'data/tecdoc-mappings.json'
      dry_run:
        description: 'Dry run (generate SQL only, do not execute)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SQL from TecDoc mappings
        run: node scripts/import-tecdoc-ktype.mjs "${{ github.event.inputs.input_file }}" --dry-run

      - name: Upload SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tecdoc-import-sql
          path: "${{ github.event.inputs.input_file }}"-import.sql

      - name: Execute on remote D1 (if not dry run)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          SQL_FILE="${{ github.event.inputs.input_file }}"-import.sql
          npx wrangler d1 execute glass-catalog-db --remote --file "$SQL_FILE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          npx wrangler d1 execute glass-catalog-db --remote --command "SELECT COUNT(*) as populated FROM glass_catalog WHERE ktype IS NOT NULL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
