    <script>
      // Cache-bust: force reload if this HTML is stale
      (function() {
        var deployed = 'v3-' + new Date().toISOString().slice(0,10);
        var stored = localStorage.getItem('ag-version');
        if (stored && stored !== deployed) {
          localStorage.setItem('ag-version', deployed);

          localStorage.setItem('ag-version', deployed);

      })();
