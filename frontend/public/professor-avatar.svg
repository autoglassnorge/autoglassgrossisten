<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Skin gradient -->
    <radialGradient id="skinGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f5d0b0"/>
      <stop offset="60%" stop-color="#e8b896"/>
      <stop offset="100%" stop-color="#d4a078"/>
    </radialGradient>
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#b8b8b8"/>
    </linearGradient>
    <!-- Blue shirt gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5aa8"/>
      <stop offset="100%" stop-color="#0f3d7a"/>
    </linearGradient>
    <!-- Glass reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#f0f4f8"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#1e5aa8" stroke-width="3"/>

  <!-- Shoulders/Body -->
  <path d="M 60 380 Q 200 320 340 380 L 340 400 L 60 400 Z" fill="url(#shirtGrad)"/>
  <path d="M 130 340 Q 200 360 270 340 L 270 380 Q 200 400 130 380 Z" fill="#0a2e5c"/>

  <!-- Shirt collar -->
  <path d="M 160 335 L 200 365 L 240 335 L 240 350 L 200 380 L 160 350 Z" fill="#ffffff"/>
  <path d="M 175 340 L 200 360 L 225 340" fill="none" stroke="#1e5aa8" stroke-width="2"/>

  <!-- Tie -->
  <path d="M 190 365 L 210 365 L 205 395 L 195 395 Z" fill="#c41e3a"/>
  <path d="M 192 370 L 208 370 L 205 390 L 195 390 Z" fill="#a01830"/>

  <!-- Neck -->
  <rect x="165" y="280" width="70" height="60" rx="10" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="130" cy="230" rx="18" ry="28" fill="url(#skinGrad)"/>
  <ellipse cx="270" cy="230" rx="18" ry="28" fill="url(#skinGrad)"/>
  <!-- Ear details -->
  <path d="M 125 220 Q 120 230 125 240" fill="none" stroke="#c4956a" stroke-width="2"/>
  <path d="M 275 220 Q 280 230 275 240" fill="none" stroke="#c4956a" stroke-width="2"/>

  <!-- Face shape -->
  <ellipse cx="200" cy="210" rx="85" ry="105" fill="url(#skinGrad)"/>

  <!-- Hair (sides/back) -->
  <path d="M 120 180 Q 115 220 125 260 Q 130 230 140 200 Z" fill="url(#hairGrad)"/>
  <path d="M 280 180 Q 285 220 275 260 Q 270 230 260 200 Z" fill="url(#hairGrad)"/>

  <!-- Hair (top) -->
  <path d="M 115 180 Q 130 100 200 95 Q 270 100 285 180 Q 290 140 250 110 Q 200 90 150 110 Q 110 140 115 180 Z" fill="url(#hairGrad)"/>
  <!-- Hair texture lines -->
  <path d="M 150 115 Q 170 125 180 140" fill="none" stroke="#a0a0a0" stroke-width="1.5"/>
  <path d="M 200 105 Q 210 120 205 135" fill="none" stroke="#a0a0a0" stroke-width="1.5"/>
  <path d="M 250 115 Q 230 125 220 140" fill="none" stroke="#a0a0a0" stroke-width="1.5"/>

  <!-- Eyebrows -->
  <path d="M 145 175 Q 165 165 185 175" fill="none" stroke="#a0a0a0" stroke-width="4" stroke-linecap="round"/>
  <path d="M 215 175 Q 235 165 255 175" fill="none" stroke="#a0a0a0" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="165" cy="195" rx="14" ry="10" fill="#ffffff"/>
  <ellipse cx="235" cy="195" rx="14" ry="10" fill="#ffffff"/>
  <circle cx="165" cy="195" r="6" fill="#4a3728"/>
  <circle cx="235" cy="195" r="6" fill="#4a3728"/>
  <circle cx="167" cy="193" r="2.5" fill="#ffffff"/>
  <circle cx="237" cy="193" r="2.5" fill="#ffffff"/>

  <!-- Eye wrinkles (experience) -->
  <path d="M 140 190 Q 130 195 140 200" fill="none" stroke="#c4956a" stroke-width="1.5" opacity="0.6"/>
  <path d="M 260 190 Q 270 195 260 200" fill="none" stroke="#c4956a" stroke-width="1.5" opacity="0.6"/>
  <path d="M 145 205 Q 165 210 185 205" fill="none" stroke="#c4956a" stroke-width="1" opacity="0.4"/>
  <path d="M 215 205 Q 235 210 255 205" fill="none" stroke="#c4956a" stroke-width="1" opacity="0.4"/>

  <!-- Glasses -->
  <rect x="140" y="182" width="50" height="28" rx="8" fill="none" stroke="#2c2c2c" stroke-width="3"/>
  <rect x="210" y="182" width="50" height="28" rx="8" fill="none" stroke="#2c2c2c" stroke-width="3"/>
  <!-- Bridge -->
  <path d="M 190 195 Q 200 190 210 195" fill="none" stroke="#2c2c2c" stroke-width="2.5"/>
  <!-- Temple arms -->
  <path d="M 140 190 L 125 185" fill="none" stroke="#2c2c2c" stroke-width="2"/>
  <path d="M 260 190 L 275 185" fill="none" stroke="#2c2c2c" stroke-width="2"/>
  <!-- Glass reflection -->
  <rect x="143" y="185" width="20" height="12" rx="4" fill="url(#glassReflect)"/>
  <rect x="213" y="185" width="20" height="12" rx="4" fill="url(#glassReflect)"/>

  <!-- Nose -->
  <path d="M 195 215 Q 200 245 195 255" fill="none" stroke="#c4956a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 185 252 Q 200 262 215 252" fill="none" stroke="#c4956a" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose shadow -->
  <ellipse cx="200" cy="245" rx="8" ry="12" fill="#d4a078" opacity="0.3"/>

  <!-- Smile -->
  <path d="M 170 275 Q 200 295 230 275" fill="none" stroke="#a07050" stroke-width="3" stroke-linecap="round"/>
  <!-- Smile dimples -->
  <path d="M 165 270 Q 170 275 168 280" fill="none" stroke="#c4956a" stroke-width="1.5" opacity="0.5"/>
  <path d="M 235 270 Q 230 275 232 280" fill="none" stroke="#c4956a" stroke-width="1.5" opacity="0.5"/>

  <!-- Chin -->
  <ellipse cx="200" cy="285" rx="25" ry="12" fill="#d4a078" opacity="0.2"/>

  <!-- Autoglass badge on shirt -->
  <circle cx="250" cy="350" r="18" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="250" cy="350" r="14" fill="#1e5aa8"/>
  <text x="250" y="354" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">AG</text>

  <!-- Small car windshield detail in corner (subtle) -->
  <g opacity="0.08" transform="translate(320, 320)">
    <path d="M 0 30 L 10 0 L 50 0 L 60 30 Z" fill="#1e5aa8"/>
    <path d="M 5 28 L 12 5 L 48 5 L 55 28 Z" fill="#87ceeb"/>
  </g>
</svg>