name = "autoglass-glass-sok"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# ── KV Namespace (katalog + cache) ────────────────────────────
[[kv_namespaces]]
binding = "GLASS_CATALOG"
id = "15099e572e51423dafb723996c01c668"

# ── D1 Database (glasskatalog SQL) ────────────────────────────
# 1. Opprett database:
#    wrangler d1 create glass-catalog-db
[[d1_databases]]
binding = "GLASS_CATALOG_D1"
database_name = "glass-catalog-db"
database_id = "f79095b3-da80-43fe-8064-ff480e8a1b4b"

# ── Secrets (IKKE legg dem i denne filen — bruk wrangler secret put):
#
#    Primær kilde — SVV Enkeltoppslag (åpent API):
#    wrangler secret put SVV_API_KEY
#
#    Fallback — Biluppgifter (Sverige):
#    wrangler secret put BILUPPGIFTER_API_KEY

[vars]
# Ingen hardkodede secrets her
ENVIRONMENT = "production"
